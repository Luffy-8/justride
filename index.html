<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JustRide</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <h1>JustRide</h1>

            <div>
                <a href="#">How It Works</a>
                <a href="#">Login</a>
                <button>Sign Up</button>
            </div>
        </nav>
    </header>

    <main>

        <section>
            <h2>Find someone going your way.</h2>

            <p>
                Get an affordable ride.
                Earn from your commute.
            </p>

            <button>Find a Ride</button>
            <button>Offer a Ride</button>
        </section>

        <section>
            <h2>How JustRide Works</h2>

            <div>
                <h3>1. Request</h3>
                <p>Enter where you want to go.</p>
            </div>

            <div>
                <h3>2. Match</h3>
                <p>Find someone already going your way.</p>
            </div>

            <div>
                <h3>3. Ride</h3>
                <p>Meet up and complete your ride.</p>
            </div>
        </section>

    </main>

    <footer>
        <p>Ride together. Save together.</p>
    </footer>
    
</body>
</html>
</html>
